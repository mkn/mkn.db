

name: mkn.db
property:
  # dependency versions: master on master, latest on latest (a bare dep is the default branch)
  clang.format.version: master
  mkn.kul.version: master

parent: build

profile:
- name: build
  inc: ./inc
  dep:
    - name: mkn.kul
      version: ${mkn.kul.version}

- name: postgres
  parent: build
  dep:
    - name: db.pqxx
      version: master

# - name: mysql
#   parent: build
#   dep:
#     - name: db.mysql
#       version: master

- name: test
  parent: build
  mode: none
  self: postgres #mysql
  main: test.cpp

- name: format
  mod:
  - name: clang.format
    version: ${clang.format.version}
    init:
      style: file
      types: cpp:cxx:cc:h:hpp
      paths: .
